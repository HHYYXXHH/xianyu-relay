<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲鱼自动回复 - 规则管理</title>
<style>
/* ===== 基础样式 ===== */
:root {
  --bg: #f5f5f5;
  --card: #ffffff;
  --border: #e0e0e0;
  --text: #333333;
  --muted: #888888;
  --primary: #1677ff;
  --danger: #ff4d4f;
  --success: #52c41a;
  --warning: #faad14;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* ===== 布局 ===== */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header-actions { display: flex; gap: 8px; }

.container {
  display: flex;
  height: calc(100vh - 54px);
}

/* ===== 左侧产品列表 ===== */
.sidebar {
  width: 240px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}
.sidebar-title {
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.product-item {
  padding: 10px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid transparent;
  font-size: 14px;
  transition: all 0.15s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.product-item:hover { background: #f0f5ff; }
.product-item.active { background: #e6f4ff; border-color: var(--primary); color: var(--primary); font-weight: 500; }
.product-item .badge {
  font-size: 11px;
  background: var(--border);
  color: var(--muted);
  padding: 1px 6px;
  border-radius: 10px;
}
.btn-sidebar { width: 100%; }

/* ===== 右侧内容区 ===== */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ===== 卡片 ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-header h2 { font-size: 15px; font-weight: 600; }
.card-body { padding: 16px 20px; }
.card-body.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* ===== 表格 ===== */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
th { background: #fafafa; font-weight: 600; color: var(--muted); font-size: 12px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }

.keyword-tag {
  display: inline-block;
  background: #f0f5ff;
  color: var(--primary);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  margin: 2px 4px 2px 0;
}
.priority-badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.priority-badge.must { background: #fff2e8; color: #fa541c; }
.priority-badge.normal { background: #f0f5ff; color: var(--primary); }

.reply-preview { max-width: 350px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== 按钮 ===== */
button {
  padding: 6px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
button:hover { border-color: var(--primary); color: var(--primary); }
button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
button.primary:hover { background: #4096ff; }
button.danger { color: var(--danger); }
button.danger:hover { border-color: var(--danger); background: #fff2f0; }
button.small { padding: 3px 10px; font-size: 12px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== 表单 ===== */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  font-family: inherit;
}
.form-group textarea { min-height: 70px; resize: vertical; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal {
  background: var(--card);
  border-radius: 12px;
  padding: 24px;
  width: 560px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.12);
}
.modal h3 { margin-bottom: 16px; font-size: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ===== Toast ===== */
.toast {
  position: fixed; top: 16px; right: 16px;
  padding: 12px 20px; border-radius: var(--radius);
  color: #fff; font-size: 13px; z-index: 200;
  animation: fadeIn 0.2s ease;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 约束列表 ===== */
.constraint-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid #f0f0f0;
}
.constraint-item:last-child { border-bottom: none; }
.constraint-item .num {
  color: var(--muted); font-size: 12px; min-width: 20px; padding-top: 2px;
}
.constraint-item .text { flex: 1; font-size: 13px; }

/* ===== 模板卡片 ===== */
.template-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.template-card {
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: all 0.15s;
  background: #fafafa;
}
.template-card:hover { border-color: var(--primary); background: #f0f5ff; }
.template-card.selected { border-color: var(--primary); background: #e6f4ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.2); }
.template-card h3 { font-size: 14px; margin-bottom: 6px; }
.template-card .desc { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.template-card .rule-count { font-size: 11px; color: var(--primary); font-weight: 500; }
.template-card.empty-card { border-style: dashed; text-align: center; }
.template-card.empty-card h3 { color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <h1>📋 闲鱼自动回复 - 规则管理</h1>
  <div class="header-actions">
    <button onclick="reloadRules()">🔄 重新加载</button>
    <button class="primary" onclick="saveRules()">💾 保存到文件</button>
  </div>
</div>

<div class="container">
  <!-- 左侧：产品列表 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">📦 商品列表</div>
    <div id="productList"></div>
    <button class="btn-sidebar small" onclick="showAddProduct()" style="margin-top:8px">+ 添加商品</button>
    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0">
    <div class="sidebar-title" style="margin-top:4px">🌐 全局设置</div>
    <div class="product-item" data-tab="global" onclick="switchTab('global')">
      <span>全局规则</span>
      <span class="badge" id="globalCount">0</span>
    </div>
    <div class="product-item" data-tab="constraints" onclick="switchTab('constraints')">
      <span>LLM 约束</span>
      <span class="badge" id="constraintCount">0</span>
    </div>
  </div>

  <!-- 右侧：规则编辑器 -->
  <div class="main" id="mainContent"></div>
</div>

<!-- 编辑规则弹窗 -->
<div class="modal-overlay" id="ruleModal" style="display:none">
  <div class="modal">
    <h3 id="modalTitle">编辑规则</h3>
    <div class="form-group">
      <label>触发关键词（用逗号分隔）</label>
      <input type="text" id="ruleKeywords" placeholder="例如：保修, 质保, 坏了, 维修">
    </div>
    <div class="form-group">
      <label>自动回复内容</label>
      <textarea id="ruleReply" placeholder="输入匹配到关键词后的自动回复内容..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>优先级</label>
        <select id="rulePriority">
          <option value="must">必须 (must) — LLM 不可覆盖</option>
          <option value="normal">普通 (normal) — LLM 可辅助润色</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button onclick="closeRuleModal()">取消</button>
      <button class="primary" onclick="saveRuleForm()">确定</button>
    </div>
  </div>
</div>

<!-- 添加商品弹窗（含模板选择 + 闲鱼商品导入） -->
<div class="modal-overlay" id="productModal" style="display:none">
  <div class="modal" style="width:700px">
    <h3>添加商品</h3>
    <div class="form-group">
      <label>商品名称 / ID</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="newProductName" placeholder="手动输入商品名称" onkeyup="updateAddBtn()" style="flex:1">
        <button class="small" id="xianyuFetchBtn" onclick="fetchXianyuGoods()" style="white-space:nowrap">📱 从闲鱼获取</button>
      </div>
      <div id="xianyuGoodsList" style="display:none;margin-top:8px;max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px"></div>
    </div>
    <div style="margin-top:16px">
      <label style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;display:block">
        📋 选择规则模板（可选，后续可自由修改）
      </label>
      <div class="template-grid" id="addTemplateGrid">加载中...</div>
    </div>
    <div class="modal-actions" style="margin-top:16px">
      <button onclick="closeProductModal()">取消</button>
      <button class="primary" id="addProductBtn" onclick="addProductWithTemplate()" disabled>确定</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
// ===== 状态 =====
let rulesData = {};
let currentProduct = null;
let currentTab = 'global';  // 'product' | 'global' | 'constraints'
let editingRule = null;     // 当前编辑的规则索引
let editingProduct = null;  // 当前编辑规则所属商品

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', loadRules);

async function loadRules() {
  try {
    const res = await fetch('/api/rules');
    rulesData = await res.json();
    if (!rulesData.products) rulesData.products = {};
    if (!rulesData.global_rules) rulesData.global_rules = [];
    if (!rulesData.llm_constraints) rulesData.llm_constraints = [];
    renderSidebar();
    switchTab('global');
  } catch (e) {
    toast('加载规则失败: ' + e.message, 'error');
  }
}

async function reloadRules() {
  await fetch('/api/rules/reload', { method: 'POST' });
  await loadRules();
  toast('规则已重新加载', 'success');
}

async function saveRules() {
  try {
    const res = await fetch('/api/rules/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(rulesData),
    });
    const data = await res.json();
    if (data.success) toast('规则已保存到 rules.yaml', 'success');
    else toast('保存失败: ' + data.error, 'error');
  } catch (e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

// ===== 侧边栏 =====
function renderSidebar() {
  const products = Object.keys(rulesData.products || {});
  const list = document.getElementById('productList');
  list.innerHTML = products.map(id => {
    const rules = rulesData.products[id].rules || [];
    const enabled = rulesData.products[id].enabled !== false;
    return `<div class="product-item${currentProduct===id&&currentTab==='product'?' active':''}"
                data-product="${escapeHtml(id)}"
                onclick="switchProduct('${escapeJs(id)}')"
                style="${enabled?'':'opacity:0.5'}">
              <span>${escapeHtml(id)}</span>
              <span class="badge">${rules.length} 规则</span>
            </div>`;
  }).join('');

  document.getElementById('globalCount').textContent = (rulesData.global_rules || []).length;
  document.getElementById('constraintCount').textContent = (rulesData.llm_constraints || []).length;

  // 高亮当前选中的 tab
  document.querySelectorAll('.product-item[data-tab]').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === currentTab);
  });
}

function switchProduct(productId) {
  currentProduct = productId;
  currentTab = 'product';
  renderSidebar();
  renderProductRules(productId);
}

function switchTab(tab) {
  currentTab = tab;
  currentProduct = null;
  renderSidebar();
  if (tab === 'global') renderGlobalRules();
  else if (tab === 'constraints') renderConstraints();
}

// ===== 商品规则视图 =====
function renderProductRules(productId) {
  const product = rulesData.products[productId] || { enabled: true, rules: [] };
  const rules = product.rules || [];
  const enabled = product.enabled !== false;

  const main = document.getElementById('mainContent');

  let rulesSection;
  if (rules.length === 0) {
    rulesSection = `<div class="card-body empty">
      <p style="margin-bottom:16px;font-size:14px">该商品尚未配置规则，请选择模板快速创建，或从零开始手动添加</p>
      <div class="template-grid" id="inlineTemplateGrid">加载中...</div>
      <div style="margin-top:12px">
        <button class="small primary" onclick="applyTemplateToProduct('${escapeJs(productId)}')" id="applyTemplateBtn" disabled>📋 应用选中模板</button>
        <button class="small" onclick="showAddRule('${escapeJs(productId)}')" style="margin-left:8px">✏️ 从零手动添加</button>
      </div>
    </div>`;
  } else {
    rulesSection = renderRulesTable(rules, productId);
  }

  main.innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2>📦 ${escapeHtml(productId)} — 商品规则 (${rules.length})</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="small" onclick="toggleProduct('${escapeJs(productId)}')">
            ${enabled ? '✅ 已启用' : '⏸ 已停用'}
          </button>
          <button class="small danger" onclick="deleteProduct('${escapeJs(productId)}')">删除商品</button>
          <button class="small primary" onclick="showAddRule('${escapeJs(productId)}')">+ 添加规则</button>
        </div>
      </div>
      ${rulesSection}
    </div>

    <div class="card" style="margin-top:0">
      <div class="card-header">
        <h2>🧪 测试匹配</h2>
      </div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group" style="flex:3">
            <label>输入模拟买家消息</label>
            <input type="text" id="testMessage" placeholder="例如：这个还在保修吗？" onkeydown="if(event.key==='Enter')testMatch('${escapeJs(productId)}')">
          </div>
          <div class="form-group" style="flex:1;display:flex;align-items:flex-end">
            <button class="primary" onclick="testMatch('${escapeJs(productId)}')" style="width:100%">测试</button>
          </div>
        </div>
        <div id="testResult" style="margin-top:8px;font-size:13px"></div>
      </div>
    </div>
  `;

  // 如果没有规则，加载模板列表
  if (rules.length === 0) {
    loadTemplatesForProduct('inlineTemplateGrid', productId);
  }
}

function toggleProduct(productId) {
  const product = rulesData.products[productId];
  product.enabled = !(product.enabled !== false);
  renderSidebar();
  renderProductRules(productId);
}

function deleteProduct(productId) {
  if (!confirm(`确定删除商品"${productId}"及其全部规则？`)) return;
  delete rulesData.products[productId];
  currentProduct = null;
  currentTab = 'global';
  renderSidebar();
  renderGlobalRules();
}

// ===== 全局规则视图 =====
function renderGlobalRules() {
  const rules = rulesData.global_rules || [];
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2>🌐 全局规则 (${rules.length}) — 所有商品生效，商品规则优先</h2>
        <button class="small primary" onclick="showAddRule('_global')">+ 添加规则</button>
      </div>
      ${renderRulesTable(rules, '_global')}
    </div>
  `;
}

// ===== LLM 约束视图 =====
function renderConstraints() {
  const constraints = rulesData.llm_constraints || [];
  const main = document.getElementById('mainContent');
  const items = constraints.map((c, i) => `
    <div class="constraint-item">
      <span class="num">${i+1}.</span>
      <span class="text">${escapeHtml(c)}</span>
      <button class="small danger" onclick="deleteConstraint(${i})">×</button>
    </div>
  `).join('');

  main.innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2>🔒 LLM 硬性约束 (${constraints.length}) — AI 生成回复时必须遵守</h2>
        <button class="small primary" onclick="showAddConstraint()">+ 添加约束</button>
      </div>
      <div class="card-body">${items || '<div class="empty">暂无约束</div>'}</div>
    </div>

    <div class="card" style="margin-top:0">
      <div class="card-header"><h2>📝 添加约束</h2></div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group" style="flex:3">
            <input type="text" id="newConstraint" placeholder="例如：绝不接受私下微信转账">
          </div>
          <div class="form-group" style="flex:1;display:flex;align-items:flex-end">
            <button class="primary" onclick="addConstraint()" style="width:100%">添加</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ===== 规则表格 =====
function renderRulesTable(rules, owner) {
  if (!rules.length) return '<div class="card-body empty">暂无规则，点击上方"添加规则"按钮创建</div>';

  const rows = rules.map((r, i) => {
    const keywords = (r.trigger || []).map(k => `<span class="keyword-tag">${escapeHtml(k)}</span>`).join('');
    const priorityLabel = r.priority === 'must' ? '必须' : '普通';
    const priorityClass = r.priority === 'must' ? 'must' : 'normal';
    return `<tr>
      <td>${keywords || '<span style="color:#ccc">未设置</span>'}</td>
      <td><span class="reply-preview" title="${escapeHtml(r.reply||'')}">${escapeHtml(r.reply||'')}</span></td>
      <td><span class="priority-badge ${priorityClass}">${priorityLabel}</span></td>
      <td style="white-space:nowrap">
        <button class="small" onclick="showEditRule('${escapeJs(owner)}',${i})">编辑</button>
        <button class="small danger" onclick="deleteRule('${escapeJs(owner)}',${i})">删除</button>
      </td>
    </tr>`;
  }).join('');

  return `<div class="card-body" style="padding:0">
    <table>
      <thead><tr><th style="width:35%">触发关键词</th><th>回复内容</th><th style="width:80px">优先级</th><th style="width:120px">操作</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ===== 规则编辑弹窗 =====
function showAddRule(owner) {
  editingRule = null;
  editingProduct = owner;
  document.getElementById('modalTitle').textContent = owner === '_global' ? '添加全局规则' : `添加规则 — ${owner}`;
  document.getElementById('ruleKeywords').value = '';
  document.getElementById('ruleReply').value = '';
  document.getElementById('rulePriority').value = 'must';
  document.getElementById('ruleModal').style.display = 'flex';
}

function showEditRule(owner, index) {
  editingProduct = owner;
  editingRule = index;
  const rules = owner === '_global'
    ? rulesData.global_rules
    : (rulesData.products[owner]?.rules || []);
  const rule = rules[index];
  document.getElementById('modalTitle').textContent = '编辑规则';
  document.getElementById('ruleKeywords').value = (rule.trigger || []).join(', ');
  document.getElementById('ruleReply').value = rule.reply || '';
  document.getElementById('rulePriority').value = rule.priority || 'normal';
  document.getElementById('ruleModal').style.display = 'flex';
}

function closeRuleModal() {
  document.getElementById('ruleModal').style.display = 'none';
  editingRule = null;
  editingProduct = null;
}

function saveRuleForm() {
  const keywords = document.getElementById('ruleKeywords').value
    .split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const reply = document.getElementById('ruleReply').value.trim();
  const priority = document.getElementById('rulePriority').value;

  if (!keywords.length) { toast('至少需要一个关键词', 'error'); return; }
  if (!reply) { toast('回复内容不能为空', 'error'); return; }

  const newRule = { trigger: keywords, reply, priority };

  // 获取目标规则列表
  let rules;
  if (editingProduct === '_global') {
    rules = rulesData.global_rules;
  } else if (editingProduct && rulesData.products[editingProduct]) {
    rules = rulesData.products[editingProduct].rules;
  } else {
    toast('未知目标', 'error'); return;
  }

  if (editingRule !== null) {
    // 编辑模式：替换
    rules[editingRule] = newRule;
  } else {
    // 新增模式：添加到末尾
    rules.push(newRule);
  }

  closeRuleModal();
  renderSidebar();
  if (editingProduct === '_global') {
    renderGlobalRules();
  } else if (editingProduct) {
    renderProductRules(editingProduct);
  }
}

function deleteRule(owner, index) {
  if (!confirm('确定删除这条规则？')) return;
  const rules = owner === '_global'
    ? rulesData.global_rules
    : (rulesData.products[owner]?.rules || []);
  rules.splice(index, 1);
  renderSidebar();
  if (owner === '_global') renderGlobalRules();
  else renderProductRules(owner);
}

// ===== 商品管理 =====
let selectedTemplate = null;
let xianyuGoodsCache = [];  // 缓存拉取到的闲鱼商品

function showAddProduct() {
  document.getElementById('newProductName').value = '';
  document.getElementById('productModal').style.display = 'flex';
  document.getElementById('xianyuGoodsList').style.display = 'none';
  document.getElementById('xianyuFetchBtn').disabled = false;
  document.getElementById('xianyuFetchBtn').textContent = '📱 从闲鱼获取';
  xianyuGoodsCache = [];
  selectedTemplate = null;
  updateAddBtn();
  loadTemplatesForAdd();
}

async function loadTemplatesForAdd() {
  try {
    const res = await fetch('/api/rules/templates');
    const templates = await res.json();
    document.getElementById('addTemplateGrid').innerHTML = renderTemplateCards(templates, 'add');
  } catch (e) {
    document.getElementById('addTemplateGrid').innerHTML = '<span style="color:#ccc">加载模板失败</span>';
  }
}

async function fetchXianyuGoods() {
  const container = document.getElementById('xianyuGoodsList');
  const btn = document.getElementById('xianyuFetchBtn');

  // 如果已经加载过，直接切换显示/隐藏
  if (xianyuGoodsCache.length > 0) {
    container.style.display = container.style.display === 'none' ? 'block' : 'none';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ 获取中...';
  container.style.display = 'block';
  container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted)">正在从闲鱼获取商品列表...</div>';

  try {
    const res = await fetch('/api/xianyu/my_goods');
    const data = await res.json();

    if (!data.success) {
      container.innerHTML = `<div style="padding:16px;text-align:center;color:var(--danger)">
        ❌ ${escapeHtml(data.error || '获取失败')}<br>
        <span style="font-size:12px;color:var(--muted)">请确认已在 xianyu-mcp 中登录闲鱼账号</span>
      </div>`;
      btn.disabled = false;
      btn.textContent = '📱 重试获取';
      return;
    }

    if (!data.goods || data.goods.length === 0) {
      container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted)">暂无在售商品</div>';
      btn.disabled = false;
      btn.textContent = '📱 从闲鱼获取';
      return;
    }

    xianyuGoodsCache = data.goods;

    const STATUS_LABELS = { selling: '在售', sold: '已售', taken_down: '已下架' };
    container.innerHTML = xianyuGoodsCache.map((g, i) => {
      const status = STATUS_LABELS[g.status] || g.status;
      const statusColor = g.status === 'selling' ? 'var(--success)' : 'var(--muted)';
      const title = (g.title || '无标题').length > 40 ? g.title.slice(0, 40) + '...' : g.title;
      const price = g.price ? '¥' + g.price : '';
      return `<div onclick="selectXianyuGood(${i})" style="
        display:flex;align-items:center;gap:10px;padding:10px 12px;
        cursor:pointer;border-bottom:1px solid #f0f0f0;
        transition:background 0.1s;
      " onmouseenter="this.style.background='#f0f5ff'" onmouseleave="this.style.background=''">
        ${g.image_url ? `<img src="${escapeHtml(g.image_url)}" style="width:40px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0" onerror="this.style.display='none'">` : '<div style="width:40px;height:40px;background:#f0f0f0;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#ccc">无图</div>'}
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(title)}</div>
          <div style="font-size:11px;color:var(--muted);display:flex;gap:8px">
            <span>${g.item_id}</span>
            <span style="color:${statusColor}">${status}</span>
          </div>
        </div>
        <span style="font-weight:600;font-size:14px;color:var(--danger);flex-shrink:0">${price}</span>
      </div>`;
    }).join('');

    btn.textContent = '📱 已加载 ' + data.goods.length + ' 件';
    btn.disabled = false;
  } catch (e) {
    container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--danger)">网络请求失败: ' + e.message + '</div>';
    btn.disabled = false;
    btn.textContent = '📱 重试获取';
  }
}

function selectXianyuGood(index) {
  const g = xianyuGoodsCache[index];
  if (!g) return;
  // 商品名填充为 item_id（唯一标识）
  document.getElementById('newProductName').value = g.item_id;
  document.getElementById('xianyuGoodsList').style.display = 'none';
  updateAddBtn();
  toast('已选择: ' + (g.title || g.item_id));
}

async function loadTemplatesForProduct(gridId, productId) {
  try {
    const res = await fetch('/api/rules/templates');
    const templates = await res.json();
    document.getElementById(gridId).innerHTML = renderTemplateCards(templates, 'product');
    // 用 DOM 事件代替 onclick 字符串
    document.querySelectorAll(`#${gridId} .template-card`).forEach(card => {
      card.addEventListener('click', function() {
        const tplName = this.dataset.template;
        document.querySelectorAll(`#${gridId} .template-card`).forEach(c => c.classList.remove('selected'));
        this.classList.add('selected');
        document.getElementById('applyTemplateBtn').dataset.template = tplName;
        document.getElementById('applyTemplateBtn').disabled = false;
      });
    });
  } catch (e) {
    document.getElementById(gridId).innerHTML = '<span style="color:#ccc">加载模板失败</span>';
  }
}

function renderTemplateCards(templates, context) {
  if (!templates || !Object.keys(templates).length) return '<span style="color:#ccc">暂无可用模板</span>';
  return Object.entries(templates).map(([name, tpl]) => {
    const isEmpty = name === '空白模板';
    const desc = tpl.description || '';
    const count = (tpl.rules || []).length;
    const cssClass = isEmpty ? 'template-card empty-card' : 'template-card';
    const onclick = context === 'add'
      ? `onclick="selectAddTemplate('${escapeJs(name)}', this)"`
      : '';
    return `<div class="${cssClass}" data-template="${escapeHtml(name)}" title="${escapeHtml(desc)}" ${onclick}>
      <h3>${isEmpty ? '🆕' : '📦'} ${escapeHtml(name)}</h3>
      <div class="desc">${escapeHtml(desc)}</div>
      <div class="rule-count">${isEmpty ? '从零开始' : count + ' 条预设规则'}</div>
    </div>`;
  }).join('');
}

function selectAddTemplate(name, el) {
  selectedTemplate = name;
  document.querySelectorAll('#addTemplateGrid .template-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  updateAddBtn();
}

function updateAddBtn() {
  const name = document.getElementById('newProductName').value.trim();
  document.getElementById('addProductBtn').disabled = !name;
}

function closeProductModal() {
  document.getElementById('productModal').style.display = 'none';
  selectedTemplate = null;
}

async function addProductWithTemplate() {
  const name = document.getElementById('newProductName').value.trim();
  if (!name) { toast('请输入商品名称', 'error'); return; }
  if (rulesData.products[name]) { toast('该商品已存在', 'error'); return; }

  const template = selectedTemplate;

  if (template && template !== '空白模板') {
    // 从模板获取规则
    try {
      const res = await fetch('/api/rules/templates/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ template }),
      });
      const data = await res.json();
      if (data.success) {
        rulesData.products[name] = { enabled: true, rules: data.rules };
      } else {
        rulesData.products[name] = { enabled: true, rules: [] };
        toast('模板加载失败: ' + data.error, 'error');
      }
    } catch (e) {
      rulesData.products[name] = { enabled: true, rules: [] };
    }
  } else {
    // 空白模板或未选择
    rulesData.products[name] = { enabled: true, rules: [] };
  }

  closeProductModal();
  renderSidebar();
  switchProduct(name);
  toast(template && template !== '空白模板' ? `已用模板「${template}」创建商品，请根据需要修改规则` : '已创建商品');
}

async function applyTemplateToProduct(productId) {
  const template = document.getElementById('applyTemplateBtn').dataset.template;
  if (!template || template === '空白模板') {
    toast('请先选中一个模板', 'error');
    return;
  }

  try {
    const res = await fetch('/api/rules/templates/apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ template }),
    });
    const data = await res.json();
    if (data.success) {
      rulesData.products[productId].rules = data.rules;
      renderSidebar();
      renderProductRules(productId);
      toast(`已应用模板「${template}」，请根据实际情况修改规则内容`, 'success');
    } else {
      toast('模板加载失败: ' + data.error, 'error');
    }
  } catch (e) {
    toast('模板加载失败: ' + e.message, 'error');
  }
}

// 兼容旧函数名
function addProduct() {
  addProductWithTemplate();
}

// ===== 约束管理 =====
function showAddConstraint() {
  document.getElementById('newConstraint').focus();
}

function addConstraint() {
  const input = document.getElementById('newConstraint');
  const text = input.value.trim();
  if (!text) { toast('请输入约束内容', 'error'); return; }
  if (!rulesData.llm_constraints) rulesData.llm_constraints = [];
  rulesData.llm_constraints.push(text);
  input.value = '';
  renderSidebar();
  renderConstraints();
}

function deleteConstraint(index) {
  rulesData.llm_constraints.splice(index, 1);
  renderSidebar();
  renderConstraints();
}

// ===== 测试匹配 =====
async function testMatch(productId) {
  const message = document.getElementById('testMessage').value.trim();
  if (!message) { toast('请输入测试消息', 'error'); return; }

  try {
    const res = await fetch('/api/rules/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product_id: productId, message }),
    });
    const data = await res.json();
    const el = document.getElementById('testResult');
    if (data.matched) {
      const priorityText = data.priority === 'must' ? '【必须规则 - LLM不可覆盖】' : '【普通规则】';
      el.innerHTML = `<div style="background:#f6ffed;border:1px solid #b7eb8f;padding:12px;border-radius:8px">
        <strong>✅ 命中规则</strong> ${priorityText}<br>
        <span style="color:#888">匹配关键词：</span><strong>${escapeHtml(data.matched_keyword)}</strong><br>
        <span style="color:#888">自动回复：</span>${escapeHtml(data.reply)}
      </div>`;
    } else {
      el.innerHTML = `<div style="background:#fff7e6;border:1px solid #ffd591;padding:12px;border-radius:8px">
        ⚠️ 未命中任何规则，需要 LLM 兜底处理
      </div>`;
    }
  } catch (e) {
    toast('测试失败: ' + e.message, 'error');
  }
}

// ===== 工具函数 =====
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escapeJs(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

function toast(msg, type) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
